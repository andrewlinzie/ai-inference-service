name: AI Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/ci.yml"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      image_tag: ${{ steps.image-meta.outputs.image_tag }}
      image_uri: ${{ steps.image-meta.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image-meta
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/ai-inference-service:${IMAGE_TAG}

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t "${{ steps.image-meta.outputs.image_uri }}" .

      - name: Push Docker image
        run: docker push "${{ steps.image-meta.outputs.image_uri }}"

  update-gitops:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: andrewlinzie/gitops-infra
          token: ${{ secrets.GH_PAT }}
          path: gitops-infra

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          /usr/local/bin/yq --version

      - name: Update dev ai-inference-service image tag
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cd gitops-infra
          /usr/local/bin/yq -i '.image.tag = strenv(IMAGE_TAG)' dev/ai-inference-service/values.yaml
          cat dev/ai-inference-service/values.yaml

      - name: Commit and push changes
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cd gitops-infra
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dev/ai-inference-service/values.yaml
          git commit -m "chore(ai-inference-service): promote dev to ${IMAGE_TAG}" || echo "No changes to commit"
          git push