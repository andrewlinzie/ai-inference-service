name: AI Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pytest.ini"
      - "model_pin.json"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pytest.ini"
      - "model_pin.json"
      - ".github/workflows/ci.yml"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      image_tag: ${{ steps.image-meta.outputs.image_tag }}
      image_uri: ${{ steps.image-meta.outputs.image_uri }}
      model_version: ${{ steps.bake-model.outputs.model_version }}
      registry_version: ${{ steps.bake-model.outputs.registry_version }}
      run_id: ${{ steps.bake-model.outputs.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image-meta
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/ai-inference-service:${IMAGE_TAG}

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Copy pinned model into the build context
        id: bake-model
        run: |
          PIN=model_pin.json
          S3_URI=$(python3 -c "import json; print(json.load(open('$PIN'))['s3_uri'])")
          rm -rf baked_model && mkdir -p baked_model/fraud_classifier
          aws s3 cp --recursive "$S3_URI" baked_model/fraud_classifier/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path("model_pin.json").read_text())
          meta = json.loads(Path("baked_model/fraud_classifier/metadata.json").read_text())
          if meta["model_version"] != pin["model_version"]:
              raise SystemExit(
                  f"metadata model_version {meta['model_version']} != pin {pin['model_version']}"
              )
          required = {
              "model.joblib",
              "metadata.json",
              "feature_schema.json",
              "metrics.json",
              "config_snapshot.yaml",
          }
          missing = required - {p.name for p in Path("baked_model/fraud_classifier").iterdir()}
          if missing:
              raise SystemExit(f"package incomplete: {sorted(missing)}")
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as fh:
              fh.write(f"model_version={pin['model_version']}\n")
              fh.write(f"registry_version={pin['registry_version']}\n")
              fh.write(f"run_id={pin['run_id']}\n")
          print(pin["model_version"])
          PY

      - name: Build Docker image
        run: docker build -t "${{ steps.image-meta.outputs.image_uri }}" .

      - name: Push Docker image
        run: docker push "${{ steps.image-meta.outputs.image_uri }}"

  update-gitops:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: andrewlinzie/gitops-infra
          token: ${{ secrets.GH_PAT }}
          path: gitops-infra

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          /usr/local/bin/yq --version

      - name: Update dev ai-inference-service image tag
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          MODEL_VERSION: ${{ needs.build-and-push.outputs.model_version }}
          REGISTRY_VERSION: ${{ needs.build-and-push.outputs.registry_version }}
          RUN_ID: ${{ needs.build-and-push.outputs.run_id }}
        run: |
          cd gitops-infra
          /usr/local/bin/yq -i '.image.tag = strenv(IMAGE_TAG)' dev/ai-inference-service/values.yaml
          /usr/local/bin/yq -i '.model.version = strenv(MODEL_VERSION)' dev/ai-inference-service/values.yaml
          /usr/local/bin/yq -i '.model.registryVersion = strenv(REGISTRY_VERSION)' dev/ai-inference-service/values.yaml
          /usr/local/bin/yq -i '.model.runId = strenv(RUN_ID)' dev/ai-inference-service/values.yaml
          /usr/local/bin/yq -i '.livenessProbe.path = "/live"' dev/ai-inference-service/values.yaml
          cat dev/ai-inference-service/values.yaml

      - name: Commit and push changes
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cd gitops-infra
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dev/ai-inference-service/values.yaml
          git commit -m "chore(ai-inference-service): promote dev to ${IMAGE_TAG}" || echo "No changes to commit"
          git push